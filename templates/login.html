<!DOCTYPE html>
<html>

<head>
	<title>Cloud Sandbox - Login</title>

	<link rel="stylesheet"
		  href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<nav class="navbar">

	<div class="nav-title">
		Cloud Sandbox
	</div>

	<div class="nav-links">
		<a href="/">Home</a>
		<a href="/login">Login</a>
		<a href="/editor">Editor</a>
	</div>

</nav>


<div class="editor-box">

	<h1>Cloud Sandbox</h1>

	<h2>Login</h2>

	<input
		type="text"
		id="username"
		placeholder="Enter username">

	<br><br>

	<input
		type="password"
		id="password"
		placeholder="Enter password">

	<br><br>

	<button class="run-button" onclick="loginUser()">
		🔐 Login
	</button>

	<p id="message" role="status" aria-live="polite"></p>

</div>


<footer>

	<p>© 2026 Cloud Sandbox | Online Python Code Editor</p>

</footer>


<script>

function loginUser() {

	let username =
		document.getElementById("username").value;

	let password =
		document.getElementById("password").value;


	if (username === "" || password === "") {

		document.getElementById("message").innerText =
			"Please enter username and password.";

		return;
	}


	fetch("/login", {

		method: "POST",

		headers: {
			"Content-Type": "application/json"
		},

		body: JSON.stringify({

			username: username,
			password: password

		})

	})

	.then(response => response.json())

	.then(data => {

		document.getElementById("message").innerText =
			data.message;


		if (data.message === "Login successful!") {

			localStorage.setItem(
				"username",
				data.username
			);

			window.location.href = "/editor";

		}

	})

	.catch(error => {

		document.getElementById("message").innerText =
			"Error connecting to server.";

	});

}

</script>

</body>

</html>
