<!DOCTYPE html>
<html>
<body>

<div class="header">
    <h1>Cloud Sandbox</h1>
    <p>Online Python Code Editor</p>
</div>

<div class="container">

    <div class="editor-box">

        <h2>Code Editor</h2>

        <textarea id="code"
            placeholder="Write your Python code here..."></textarea>
<br>

        <button class="run-button" onclick="runCode()">
            ▶ Run Code
        </button>

        <h2>Output</h2>

        <textarea id="output"
            readonly
            placeholder="Your output will appear here..."></textarea>

    </div>

</div>

<script>

function runCode() {

	let code = document.getElementById("code").value;

	document.getElementById("output").value = "Running...";

	fetch("/run", {
		method: "POST",

		headers: {
			"Content-Type": "application/json"
		},

		body: JSON.stringify({
			code: code
		})
	})

	.then(response => response.json())

	.then(data => {
		document.getElementById("output").value = data.output;
	})

	.catch(error => {
		document.getElementById("output").value =
			"Error: " + error;
	});
}

</script>

</body>
</html>
